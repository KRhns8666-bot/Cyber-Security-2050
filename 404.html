<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07090F">
<title>Page not found · Kai Cyber</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2307090F'/%3E%3Ccircle cx='8' cy='8' r='3.5' fill='%23E3001B'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#07090F; --ink:#F2F4F8; --ink-dim:#8A96B0; --ink-faint:#48536A;
    --line:#1C2238; --accent:#E3001B; --accent-dim:#8C0010;
    --sans:-apple-system,"Helvetica Neue",Helvetica,"Arial Nova",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    padding:2rem; gap:1.25rem;
  }
  .code{font-family:var(--mono);font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
  h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:600;letter-spacing:-.02em;margin:0;max-width:22ch}
  p{color:var(--ink-dim);max-width:46ch;margin:0;line-height:1.6}
  .links{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:.5rem}
  a.btn{
    font-family:var(--mono);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;
    text-decoration:none;color:var(--ink);border:1px solid var(--line);
    padding:.8rem 1.4rem;border-radius:4px;transition:border-color 180ms,color 180ms;
  }
  a.btn:hover{border-color:var(--accent);color:var(--accent)}
  a.btn.primary{border-color:var(--accent-dim);color:var(--accent)}
  a.btn.primary:hover{background:var(--accent);color:var(--bg)}
</style>
</head>
<body>
  <span class="code">404 · not found</span>
  <h1>This page doesn't exist. Real threats do — that's the point.</h1>
  <p>Whatever you were looking for isn't here. It might have moved, or the link may have a typo.</p>
  <div class="links">
    <a class="btn primary" href="/">← Back to Kai Cyber</a>
    <a class="btn" href="/radar/">Live Radar</a>
    <a class="btn" href="/#guides">Free guides</a>
  </div>
</body>
</html>
